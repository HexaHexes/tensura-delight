plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Must match rootProject.name and mod_id; the jar is <mod_id>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests compile against main but are never part of it, so the jar cannot
// ship them. Declared before neoForge because the mods block joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

// Runtime closure for the dev server / GameTest runs: staged into run/mods by
// prepareGametestMods, so a clean checkout (and CI) needs no local jars.
configurations {
    gametestMods
    // ManasCore ships its modules as FML nested jars; javac cannot see inside
    // them, and Tensura's public types extend those module types.
    manascoreBundle
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless verification: boots GameTestServer, runs every @GameTest, exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }

        // Regenerates src/generated/resources - the meal grant table that ships
        // inside the jar. --mod scopes datagen to this mod only; the staged
        // closure below satisfies the toml's mandatory deps FML checks in a data run.
        data {
            data()
            gameDirectory = project.layout.projectDirectory.dir('run')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // Joined so @GameTestHolder is discovered in dev runs; still not jarred.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml, so mod identity is edited in gradle.properties only.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            // Dependency versions, so the toml ranges always match the pins.
            tensura_mod_version          : tensura_mod_version,
            manascore_mod_version        : manascore_mod_version,
            farmers_delight_mod_version  : farmers_delight_mod_version,
            brewin_and_chewin_mod_version: brewin_and_chewin_mod_version,
            dungeons_delight_mod_version : dungeons_delight_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Passing the provider as a source dir also wires the generation order.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The generated datapack is committed and packaged as part of the mod's
// resources: datagen owns data/**, and the CI drift gate keeps the committed
// tree identical to what runData produces.
sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ManasCore's nested module jars are exploded onto the compile classpath; the
// input still comes from CurseMaven, so nothing is committed.
def manascoreModulesDir = layout.buildDirectory.dir('manascore-modules')
def extractManascoreModules = tasks.register('extractManascoreModules', Sync) {
    from({ configurations.manascoreBundle.collect { zipTree(it) } })
    include 'META-INF/jars/*.jar'
    eachFile { it.path = it.name }
    includeEmptyDirs = false
    into manascoreModulesDir
}
def manascoreModuleJars = fileTree(dir: manascoreModulesDir.get().asFile, include: '*.jar')

tasks.withType(JavaCompile).configureEach {
    dependsOn extractManascoreModules
}

// The junit CI check refuses to pass an empty suite, so this stays wired in
// every derived repo.
repositories {
    // CurseMaven - resolves mod jars by CurseForge project + file id. Every mod
    // dependency declared below resolves from here, so a clean checkout needs
    // no local jars.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    mavenCentral()
}

dependencies {
    // Tensura: Reincarnated - the required target, and ManasCore plus the types
    // reachable from Tensura's public surface. Compile only: all rights
    // reserved, never bundled or committed.
    compileOnly "curse.maven:tensura-reincarnated-643695:${tensura_file_id}"
    compileOnly "curse.maven:manascore-619025:${manascore_file_id}"
    compileOnly files(manascoreModuleJars)
    compileOnly "curse.maven:architectury-419699:${architectury_file_id}"

    // Farmer's Delight - the required food base the other two extend.
    compileOnly "curse.maven:farmers-delight-398521:${farmers_delight_file_id}"

    // Optional feature mods. Each is gated behind ModList, so its absence must
    // never be a compile problem - but compiling against it keeps the gate honest.
    compileOnly "curse.maven:brewin-and-chewin-637808:${brewin_and_chewin_file_id}"
    compileOnly "curse.maven:dungeons-delight-1258923:${dungeons_delight_file_id}"
    compileOnly "curse.maven:runiclib-880879:${runic_lib_file_id}"

    manascoreBundle "curse.maven:manascore-619025:${manascore_file_id}"

    // Tensura's required dependency closure plus the delight mods, for the
    // run-only mods folder.
    gametestMods "curse.maven:tensura-reincarnated-643695:${tensura_file_id}"
    gametestMods "curse.maven:manascore-619025:${manascore_file_id}"
    gametestMods "curse.maven:architectury-419699:${architectury_file_id}"
    gametestMods "curse.maven:geckolib-388172:${geckolib_file_id}"
    gametestMods "curse.maven:smartbrainlib-661293:${smartbrainlib_file_id}"
    gametestMods "curse.maven:terrablender-940057:${terrablender_file_id}"
    gametestMods "curse.maven:farmers-delight-398521:${farmers_delight_file_id}"
    gametestMods "curse.maven:brewin-and-chewin-637808:${brewin_and_chewin_file_id}"
    gametestMods "curse.maven:dungeons-delight-1258923:${dungeons_delight_file_id}"
    gametestMods "curse.maven:runiclib-880879:${runic_lib_file_id}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gson rides inside Minecraft; pinned here so the parser tests run on a
    // bare JVM with no game classes on the test classpath.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Stage the closure into the run's production-style mods/ folder, where FML's
// mods-folder locator finds it exactly like in a pack. Every run that boots
// into run/ takes it, data runs included: FML validates the toml's deps there.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

tasks.matching {
    it.name == 'runGameTestServer' || it.name == 'runServer' || it.name == 'runClient'
            || it.name == 'runData'
}.configureEach {
    dependsOn 'prepareGametestMods'
}

// --- GameTest harness -------------------------------------------------------

// Grade the run on the log summary: the task's exit code is not a reliable
// signal. Keep expectedTests in sync with the @GameTest methods.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 6
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// release.yml tags, publish.yml drives this block. Keep the URL pointing at
// THIS repository; local publishes may set gpr.user / gpr.key.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/tensura-delight')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// The `static` CI job is the gate for all three. SpotBugs and Checkstyle ride
// Gradle's `check` graph too; Spotless stays out of it by design. Rationale and
// the shared-filter rules live in agents/AGENTS.md.
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    reports {
        html.required = true
        xml.required = false
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
