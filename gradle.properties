org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.259
loader_version_range=[4,)

# Dependency pins. The file ids are CurseMaven coordinates; the mod versions are
# what those files contain and are what neoforge.mods.toml ranges are built from.
# Every pin below matches the Tensura RPG instance's mods folder - verified from
# its minecraftinstance.json, not from "latest". Bump both together, deliberately,
# after re-checking the API.
tensura_file_id=8793360
tensura_mod_version=2.0.1.3
manascore_file_id=8022425
manascore_mod_version=4.0.0.2
architectury_file_id=8492726
geckolib_file_id=8893490
smartbrainlib_file_id=7055149
terrablender_file_id=6054947
farmers_delight_file_id=8765184
farmers_delight_mod_version=1.3.4
brewin_and_chewin_file_id=8309583
brewin_and_chewin_mod_version=4.5.0
dungeons_delight_file_id=9614702
# Declared version, not the 1.5.2 in this file's name: upstream still reports
# 1.5.0 from the jar's metadata, and FML checks the metadata, never the name.
dungeons_delight_mod_version=1.5.0
runic_lib_file_id=8188562

# Mod identity. Everything a rename touches lives in this block - see the
# rename checklist in README.md.
mod_id=tensura_delight
mod_name=Tensura Delight
mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.06
mod_group_id=org.bitwisemadness.tensuradelight
mod_authors=Bitwise Madness
mod_description=Brings Farmer's Delight, Brewin' And Chewin' and Dungeon's Delight into Tensura: Reincarnated. Eating one of the listed meals raises the eater's maximum EP and adds magicule, scaled by how nutritious the dish is. The eater's race decides its appetite: some races refuse delight food outright, and monster meals and drinks pay only to the races that eat them. The delight workstations cook Tensura ingredients.

# The single source of truth for the version. ci.yml reads this line, and
# version-bump.yml rewrites it. Never hardcode the version anywhere else.
